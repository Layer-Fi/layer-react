name: Chromatic

# Snapshot budget is controlled at four levels:
#   1. Trigger — path filters keep test-only, doc-only, and workflow-only PRs
#      from starting a build at all, and drafts are skipped until review-ready.
#   2. Concurrency — superseded commits on the same PR cancel the older build.
#   3. Scope (STORYBOOK_SCOPE=chromatic) — the build itself contains only the
#      design system (ui/, blocks/) and agent scratch stories. Feature and view
#      stories compose those primitives, so a regression in one surfaces in its
#      primitive's snapshot, at a fraction of the cost. Scoping via the build
#      rather than Chromatic's --only-story-files is deliberate: that flag is
#      mutually exclusive with --only-changed, and TurboSnap is worth keeping.
#   4. TurboSnap (onlyChanged) — narrows further to the stories whose Vite
#      dependency graph the diff reaches.
#
# TurboSnap diffs against the newest ancestor build, so the push-on-main job
# keeps a baseline available for PRs branched off main.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - src/**
      - '!src/**/*.test.ts'
      - '!src/**/*.test.tsx'
      - '!src/**/*.test-d.ts'
      - '!src/**/SKILL.md'
      - .storybook/**
      - vite.config.ts
      - tsconfig.json
      - package.json
      - package-lock.json
      - .github/workflows/chromatic.yml
  push:
    branches:
      - main
    paths:
      - src/**
      - '!src/**/*.test.ts'
      - '!src/**/*.test.tsx'
      - '!src/**/*.test-d.ts'
      - '!src/**/SKILL.md'
      - .storybook/**
      - vite.config.ts
      - tsconfig.json
      - package.json
      - package-lock.json
      - .github/workflows/chromatic.yml

permissions:
  contents: read

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chromatic:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        # Chromatic's TurboSnap needs full git history to diff against baselines.
        fetch-depth: 0
        # Check out the PR head instead of the ephemeral merge commit, which is
        # absent from git history and degrades baseline/dependency analysis.
        # Assumes same-repo PRs; a fork's head.ref would not resolve here.
        ref: ${{ github.event.pull_request.head.ref || github.ref }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Chromatic
      id: chromatic
      uses: chromaui/action@v18
      with:
        projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        buildScriptName: storybook:build
        onlyChanged: true
        exitZeroOnChanges: true
        skip: ${{ github.event.pull_request.draft == true }}
        autoAcceptChanges: ${{ github.event_name == 'push' }}
      env:
        STORYBOOK_SCOPE: chromatic

    - name: Link published Storybook
      if: steps.chromatic.outputs.storybookUrl != ''
      env:
        STORYBOOK_URL: ${{ steps.chromatic.outputs.storybookUrl }}
      run: |
        echo "## Storybook preview" >> "$GITHUB_STEP_SUMMARY"
        echo "$STORYBOOK_URL" >> "$GITHUB_STEP_SUMMARY"
