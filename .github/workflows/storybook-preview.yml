name: Storybook Preview

# Vercel's automatic deployments are off for `layer-react-storybook`, so previews are built on
# request: most PRs never need one, and each points at a live business. The `storybook-preview` label
# is sticky state — applying it builds, later pushes rebuild, removing it stops.
#
# A label rather than a `/storybook` comment because applying one already requires write access, so
# authorization comes from GitHub rather than an `author_association` check this has to keep right —
# which matters with VERCEL_TOKEN in a public repository.

on:
  pull_request:
    types: [opened, reopened, labeled, synchronize]

permissions:
  contents: read
  pull-requests: write
  # For the commit status carrying the preview link, which Vercel's own check used to provide.
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Identifies the comment this workflow owns, so it is updated in place rather than repeated.
  MARKER: <!-- storybook-preview -->
  STATUS_CONTEXT: Storybook Preview

jobs:
  instructions:
    name: Offer a preview
    # Skipped once labelled, so reopening can't overwrite a URL. Forks have no writable token.
    if: |
      (github.event.action == 'opened' || github.event.action == 'reopened')
      && !contains(github.event.pull_request.labels.*.name, 'storybook-preview')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Comment how to request one
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        body="$MARKER
        **Storybook preview** — add the \`storybook-preview\` label to build one.

        It renders stories against a live sandbox business instead of MSW fixtures, and stays up to
        date on every push while the label is applied. See \`.storybook/README.md\`."
        id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
          --jq "first(.[] | select(.body | contains(\"$MARKER\")) | .id)")
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body"
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body"
        fi

  deploy:
    name: Build preview
    if: |
      (
        (github.event.action == 'labeled' && github.event.label.name == 'storybook-preview')
        || (
          github.event.action == 'synchronize'
          && contains(github.event.pull_request.labels.*.name, 'storybook-preview')
        )
      )
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    # Before checkout, so the checks box shows the build in flight rather than only its outcome.
    - name: Mark the status pending
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
          -f state=pending -f context="$STATUS_CONTEXT" -f description='Building preview…'

    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false

    # No `npm ci`: `vercel deploy` uploads source and installs on Vercel, so this only needs the CLI.
    - name: Deploy
      id: deploy
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      run: |
        npx --yes vercel@59 deploy --yes --token="$VERCEL_TOKEN" | tee deploy.log
        url=$(grep -oE 'https://[a-z0-9-]+\.vercel\.app' deploy.log | tail -1)
        if [ -z "$url" ]; then echo "No deployment URL in output" >&2; exit 1; fi
        echo "url=$url" >> "$GITHUB_OUTPUT"

    - name: Comment the URL
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR: ${{ github.event.pull_request.number }}
        URL: ${{ steps.deploy.outputs.url }}
        SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        body="$MARKER
        **Storybook preview** — [open]($URL) (\`${SHA:0:7}\`)

        Sign in with your Layer Vercel account, then paste a sandbox business ID into the toolbar
        field. Rebuilds on every push while the label is applied; remove it to stop. See
        \`.storybook/README.md\`."
        id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
          --jq "first(.[] | select(.body | contains(\"$MARKER\")) | .id)")
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body"
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body"
        fi

    # `always()`, or a failed build leaves the status pending forever.
    - name: Report the status
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SHA: ${{ github.event.pull_request.head.sha }}
        URL: ${{ steps.deploy.outputs.url }}
      run: |
        if [ -n "$URL" ]; then
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success -f context="$STATUS_CONTEXT" \
            -f description='Preview ready' -f target_url="$URL"
        else
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=failure -f context="$STATUS_CONTEXT" -f description='Build failed'
        fi
