name: Storybook Pages

# Publishes Storybook to GitHub Pages. This is public, so by default it ships only stories
# for components exported from src/index.tsx (tagged `public-api`). Set `public_only` to
# false to publish the whole library, internals included.
#
# Builds the ref it is dispatched at — pick it in "Use workflow from". Release — Post-ship
# dispatches it at the release tag, so the public Storybook matches the "latest" dist-tag
# rather than unreleased main.
#
# It takes no ref input on purpose: checking out a ref other than the one the run was
# dispatched at would execute that code in this run's cache scope, which is what CodeQL's
# cache-poisoning query flags. Deploying from a tag needs the tag in the github-pages
# environment's deployment branch and tag policies.

on:
  workflow_dispatch:
    inputs:
      public_only:
        description: 'Publish only stories for components exported from src/index.tsx'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: storybook-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Storybook
      run: npm run storybook:build
      env:
        STORYBOOK_BASE_PATH: /${{ github.event.repository.name }}/
        STORYBOOK_SCOPE: ${{ inputs.public_only && 'public' || '' }}

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: storybook-static

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
