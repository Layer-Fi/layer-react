name: Consumers

# Installs the packed tarball into throwaway consumer apps and builds them — the only check that
# reads the published artifact rather than the repo.
#
# Release — Publish runs the same script as a gate before `npm publish`. This workflow is for
# checking any other branch by hand.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: consumer-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumers:
    name: Matrix
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # vite-esm loads in a real browser to catch mount-time failures.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Pack and test consumers
        run: npm run test:consumers
