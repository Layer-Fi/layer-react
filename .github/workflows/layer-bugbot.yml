# Layer Bugbot — AI PR review (Claude Code via Layer-Fi/layer-bugbot).
# Commands on a PR: `bugbot run` / `bugbot review` (review), `bugbot fix` / `bugbot autofix` (fix).
# All logic lives in Layer-Fi/layer-bugbot; this file only declares the triggers.
name: Layer Bugbot

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  layer-bugbot:
    # Cheap pre-filter so ordinary comments don't start the reusable workflow.
    # (contains() is case-insensitive; exact matching happens in the route job.)
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.sender.type == 'User' &&
        (contains(github.event.comment.body, 'bugbot') || contains(github.event.comment.body, 'layer review')))
    uses: Layer-Fi/layer-bugbot/.github/workflows/layer-bugbot.yml@master
    secrets: inherit
    with:
      pr_number: ${{ inputs.pr_number }}
