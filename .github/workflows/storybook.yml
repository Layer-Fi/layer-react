name: Storybook

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Storybook
      run: npm run storybook:build

    # Renaming a documented story must fail here, not at release time.
    - name: Check documented stories still resolve
      run: npm run screenshots:check

    # Chromatic only snapshots the design system, so this is what catches a broken
    # feature story or a play function that stopped producing its state.
    - name: Install Chromium
      run: npx playwright install --with-deps chromium

    - name: Render every story
      run: npm run stories:check-render
