name: Storybook

# Building every story is the only check that covers feature and view stories — Chromatic is
# scoped to the design system — so it stays, but a PR that cannot affect a story should not pay
# for a Storybook build.

on:
  pull_request:
    branches: [ main ]
    paths:
      - src/**
      - '!src/**/*.test.ts'
      - '!src/**/*.test.tsx'
      - '!src/**/*.test-d.ts'
      - '!src/**/SKILL.md'
      - .storybook/**
      - scripts/check-docs-screenshots.ts
      - scripts/docs-screenshots.manifest.ts
      - vite.config.ts
      - tsconfig.json
      - package.json
      - package-lock.json
      - .github/workflows/storybook.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Storybook
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Storybook
      run: npm run storybook:build

    # Renaming a documented story must fail here, not at release time.
    - name: Check documented stories still resolve
      run: npm run screenshots:check
