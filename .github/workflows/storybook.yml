name: Storybook

# Rendering every story is the only check that covers feature and view stories — Chromatic is
# scoped to the design system — so it stays, but a PR that cannot affect a story should not pay
# for a Storybook build, a Chromium install and a full render pass.
#
# No `branches` filter, deliberately: PRs stacked on a non-main base still get this.

on:
  pull_request:
    paths:
      - src/**
      - '!src/**/*.test.ts'
      - '!src/**/*.test.tsx'
      - '!src/**/*.test-d.ts'
      - '!src/**/SKILL.md'
      - .storybook/**
      - scripts/check-stories-render.ts
      - scripts/check-docs-screenshots.ts
      - scripts/docs-screenshots.manifest.ts
      - scripts/serve-storybook-static.ts
      - vite.config.ts
      - tsconfig.json
      - package.json
      - package-lock.json
      - .github/workflows/storybook.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Storybook
      run: npm run storybook:build

    # Renaming a documented story must fail here, not at release time.
    - name: Check documented stories still resolve
      run: npm run screenshots:check

    # Chromatic only snapshots the design system, so this is what catches a broken
    # feature story or a play function that stopped producing its state.
    - name: Install Chromium
      run: npx playwright install --with-deps chromium

    - name: Render every story
      run: npm run stories:check-render
