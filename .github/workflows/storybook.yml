name: Storybook

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Storybook
      run: npm run storybook:build

    # Renaming a documented story must fail here, not at release time.
    - name: Check documented stories still resolve
      run: npm run screenshots:check

    # Chromatic only snapshots the design system, so this is what catches a broken
    # feature story or a play function that stopped producing its state.
    - name: Install Chromium
      run: npx playwright install --with-deps chromium

    - name: Render every story
      run: npm run stories:check-render
