name: i18n - Crowdin

# One workflow for both directions, so the ordering rule below is defined once.
#
# Which half runs depends on what changed:
#   en-US changed   -> push sources up, pre-translate, pull fr-CA back down, open a PR
#   fr-CA changed   -> push those edits up so a later download cannot revert them
#   both changed    -> both, in that order
#
# Sources always upload before translations: Crowdin rejects a translation whose
# source string it does not have, so a new or renamed namespace fails otherwise.
#
# Manual runs default to the full flow, which is what a release needs: sources up,
# pre-translate, download, PR. Release — Prepare dispatches exactly this when the
# release gate reports untranslated keys.
#
#   pretranslate=false -> download only, for pulling upstream Crowdin edits
#   prune=true         -> upload sources with --delete-obsolete, deleting files and
#                         folders that no longer match the source config. Needed
#                         after a namespace rename. Destructive, so it is opt-in.
#
# Secrets:  CROWDIN_PROJECT_ID, CROWDIN_PERSONAL_TOKEN
# Variable: CROWDIN_AI_PROMPT_ID — required for full pre-translation runs.

on:
  workflow_dispatch:
    inputs:
      pretranslate:
        description: Upload English sources and run fr-CA pretranslation before downloading. Uncheck to only pull down what Crowdin already has.
        required: true
        default: true
        type: boolean
      prune:
        description: 'DESTRUCTIVE: also delete Crowdin files and folders that no longer exist in en-US'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      # Manifests only — SKILL.md lives here too and must not reach Crowdin.
      - src/assets/locales/**/*.json

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: i18n-crowdin-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Crowdin sync
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        ref: main
        fetch-depth: 0

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Classify what this push changed
      id: changed
      if: ${{ github.event_name == 'push' }}
      env:
        BEFORE_SHA: ${{ github.event.before }}
      run: |
        # Without the previous commit the halves are indistinguishable, so run both.
        ENGLISH=true
        TRANSLATIONS=true
        if git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
          git diff --quiet "$BEFORE_SHA" HEAD -- 'src/assets/locales/en-US/*.json' && ENGLISH=false
          git diff --quiet "$BEFORE_SHA" HEAD -- 'src/assets/locales/*/*.json' ':!src/assets/locales/en-US' && TRANSLATIONS=false
        fi
        echo "english=$ENGLISH" >> "$GITHUB_OUTPUT"
        echo "translations=$TRANSLATIONS" >> "$GITHUB_OUTPUT"

    # Before the translations below: Crowdin only accepts a translation for a source string it
    # already has, so a push that adds or renames a namespace file fails without this.
    - name: Upload sources to Crowdin
      if: ${{ steps.changed.outputs.english == 'true' || steps.changed.outputs.translations == 'true' || inputs.pretranslate || inputs.prune }}
      uses: crowdin/github-action@v2
      with:
        upload_sources: true
        # Renaming a namespace leaves its old file in the project; --delete-obsolete removes
        # files and folders that no longer match the source config.
        upload_sources_args: ${{ inputs.prune && '--delete-obsolete' || '' }}
        upload_translations: false
        download_translations: false
        create_pull_request: false
        push_translations: false
      env:
        CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
        CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

    - name: Upload translation changes from this push to Crowdin
      if: ${{ steps.changed.outputs.translations == 'true' }}
      uses: crowdin/github-action@v2
      with:
        command: upload translations
        command_args: --auto-approve-imported
      env:
        CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
        CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

    - name: Scaffold fr-CA keys from en-US changes
      if: ${{ steps.changed.outputs.english == 'true' }}
      env:
        BEFORE_SHA: ${{ github.event.before }}
      run: |
        if git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
          mkdir -p "$RUNNER_TEMP/en-US-before"
          git archive "$BEFORE_SHA" src/assets/locales/en-US | tar -x -C "$RUNNER_TEMP/en-US-before"
          node scripts/i18next/scaffoldTranslationsFromSourceDiff.mjs \
            "$RUNNER_TEMP/en-US-before/src/assets/locales/en-US" \
            src/assets/locales/en-US \
            src/assets/locales/fr-CA
        fi

    - name: Pre-translate fr-CA from translation memory
      if: ${{ steps.changed.outputs.english == 'true' || inputs.pretranslate }}
      uses: crowdin/github-action@v2
      with:
        command: pre-translate
        command_args: -l fr-CA --method tm --translate-untranslated-only
      env:
        CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
        CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

    - name: Require Crowdin AI prompt
      if: ${{ steps.changed.outputs.english == 'true' || inputs.pretranslate }}
      env:
        CROWDIN_AI_PROMPT_ID: ${{ vars.CROWDIN_AI_PROMPT_ID }}
      run: |
        if [ -z "$CROWDIN_AI_PROMPT_ID" ]; then
          echo "::error::Set repository variable CROWDIN_AI_PROMPT_ID to run AI pre-translation."
          exit 1
        fi

    - name: Pre-translate fr-CA with AI
      if: ${{ steps.changed.outputs.english == 'true' || inputs.pretranslate }}
      uses: crowdin/github-action@v2
      with:
        command: pre-translate
        command_args: -l fr-CA --method ai --ai-prompt ${{ vars.CROWDIN_AI_PROMPT_ID }} --translate-untranslated-only
      env:
        CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
        CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

    - name: Snapshot current fr-CA manifest
      if: ${{ github.event_name == 'workflow_dispatch' || steps.changed.outputs.english == 'true' }}
      run: cp -R src/assets/locales/fr-CA "$RUNNER_TEMP/fr-CA-before-crowdin"

    - name: Download fr-CA translations
      if: ${{ github.event_name == 'workflow_dispatch' || steps.changed.outputs.english == 'true' }}
      uses: crowdin/github-action@v2
      with:
        upload_sources: false
        upload_translations: false
        download_translations: true
        download_language: fr-CA
        skip_untranslated_strings: true
        create_pull_request: false
        push_translations: false
      env:
        CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
        CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

    - name: Normalize downloaded fr-CA file permissions
      if: ${{ github.event_name == 'workflow_dispatch' || steps.changed.outputs.english == 'true' }}
      run: |
        ls -ld src/assets/locales/fr-CA
        find src/assets/locales/fr-CA -maxdepth 1 -type f -exec ls -l {} +
        sudo chown -R "$(id -u):$(id -g)" src/assets/locales/fr-CA
        chmod -R u+rwX src/assets/locales/fr-CA
        ls -ld src/assets/locales/fr-CA
        find src/assets/locales/fr-CA -maxdepth 1 -type f -exec ls -l {} +

    - name: Apply downloaded fr-CA translations
      if: ${{ github.event_name == 'workflow_dispatch' || steps.changed.outputs.english == 'true' }}
      run: node scripts/i18next/mergeExistingTranslations.mjs "$RUNNER_TEMP/fr-CA-before-crowdin" src/assets/locales/fr-CA

    - name: Open French translations PR
      if: ${{ github.event_name == 'workflow_dispatch' || steps.changed.outputs.english == 'true' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git add src/assets/locales/fr-CA
        BR=i18n/crowdin-fr-ca
        if git diff --cached --quiet; then
          echo "No new fr-CA translations."
          echo "No fr-CA translation changes." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        git checkout -B "$BR"
        git commit -m "i18n: update fr-CA translations"
        git push -f origin "$BR"
        PR_NUMBER=$(gh pr list --head "$BR" --state open --json number --jq '.[0].number // empty')
        if [ -z "$PR_NUMBER" ]; then
          PR_URL=$(gh pr create --base main --head "$BR" \
            --title "i18n: update fr-CA translations" \
            --body "Downloaded new fr-CA translations from Crowdin for @layerfi/components.")
        else
          gh pr edit "$PR_NUMBER" \
            --title "i18n: update fr-CA translations" \
            --body "Downloaded new fr-CA translations from Crowdin for @layerfi/components."
          PR_URL=$(gh pr view "$PR_NUMBER" --json url --jq '.url')
        fi
        if [ -z "$PR_URL" ]; then
          echo "::error::Unable to resolve fr-CA translations PR URL."
          exit 1
        fi
        echo "[fr-CA translations PR]($PR_URL)" >> "$GITHUB_STEP_SUMMARY"
