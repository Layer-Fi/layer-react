name: i18n

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  i18n:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check translation keys
      run: npm run i18n:check
