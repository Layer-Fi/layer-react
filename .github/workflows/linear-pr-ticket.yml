name: Linear

# Creates a Linear issue in the LAY team for every PR and writes its identifier into the
# description. See .github/scripts/linearPrTicket.mjs for why this no longer uses the LAY-NEW magic
# word.
#
# Needs a LINEAR_API_KEY secret holding a personal API key (lin_api_…). The existing
# LINEAR_ACCESS_KEY is a pipeline key for linear-release and is rejected by the GraphQL API.
#
# Dependabot is excluded; dependency bumps would be one ticket per bump. Release bumps are excluded
# for the same reason. Run the workflow by hand with a PR number to backfill one that predates this.

on:
  pull_request:
    # Creation no longer depends on catching `opened`, so a PR that was missed picks up a ticket on
    # its next push or description edit. Purely metadata events — labeled, assigned, closed, locked
    # — cannot leave a PR needing one, so they are left out rather than burning a run each.
    types: [ opened, reopened, synchronize, edited, ready_for_review, converted_to_draft ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to create a ticket for
        required: true
        type: string

permissions:
  pull-requests: write

jobs:
  ticket:
    name: Create issue
    if: >
      github.event_name == 'workflow_dispatch' || (
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'release/v')
      )
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: .github/scripts
        sparse-checkout-cone-mode: false

    - uses: actions/setup-node@v7
      with:
        node-version: '22'

    # PR text is read inside the script rather than interpolated into run — interpolating
    # attacker-controlled PR text into a shell is an injection vector.
    - name: Create the Linear issue
      env:
        LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        LINEAR_TEAM_KEY: LAY
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number || inputs.pr }}
      run: node .github/scripts/linearPrTicket.mjs
