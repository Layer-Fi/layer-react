name: Linear

# Creates a Linear issue per PR and prefixes the PR title with it — Linear links from the title.

on:
  pull_request:
    types: [ opened, reopened, synchronize, edited, ready_for_review, converted_to_draft ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to create a ticket for
        required: true
        type: string

permissions:
  pull-requests: write

concurrency:
  group: linear-pr-ticket-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  ticket:
    name: Create issue
    # Every other exclusion is in the script, which workflow_dispatch also reaches.
    if: >
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
    - uses: actions/github-script@v9
      env:
        LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        TEAM_KEY: ${{ vars.LINEAR_TEAM }}
        PR: ${{ github.event.pull_request.number || inputs.pr }}
      with:
        script: |
          const { LINEAR_API_KEY: key, TEAM_KEY: teamKey, PR } = process.env;

          const { data: pr } = await github.rest.pulls.get({
            ...context.repo, pull_number: Number(PR),
          });

          // Before the config check: dependabot's runs get no secret, so checking the key first
          // would fail its every PR rather than skip it.
          const skip = pr.user.login === 'dependabot[bot]' ? 'opened by dependabot'
            : pr.head.ref.startsWith('release/v') ? 'a release branch'
            : (pr.state === 'closed' && !pr.merged) ? 'closed without merging'
            : null;
          if (skip) {
            core.info(`PR #${PR} skipped: ${skip}.`);
            return;
          }

          const missing = [!key && 'LINEAR_API_KEY secret', !teamKey && 'LINEAR_TEAM variable']
            .filter(Boolean);
          if (missing.length) {
            core.setFailed(`Missing ${missing.join(' and ')}. LINEAR_API_KEY must be a personal key `
              + '(lin_api_…); the GraphQL API rejects the LINEAR_ACCESS_KEY pipeline key.');
            return;
          }

          const linear = async (query, variables) => {
            // Bare key, not Bearer: Bearer is the OAuth form.
            const response = await fetch('https://api.linear.app/graphql', {
              method: 'POST',
              headers: { Authorization: key, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, variables }),
            });
            const { data, errors } = await response.json();
            if (!response.ok || errors?.length) {
              throw new Error(errors?.map(e => e.message).join('; ') ?? `HTTP ${response.status}`);
            }
            return data;
          };

          // Alone on a line in the body so prose is not a link. Linear's linking is case-sensitive,
          // so the digits are recombined with the configured key rather than used as matched.
          const loose = new RegExp(`\\b${teamKey}-(\\d+)\\b`, 'i');
          const idIn = (text, pattern) => {
            const match = pattern.exec(text ?? '');
            return match && `${teamKey}-${match[1]}`;
          };

          let identifier = idIn(pr.body, new RegExp(`^[ \t]*${teamKey}-(\\d+)[ \t]*$`, 'im'))
            || idIn(pr.title, loose)
            || idIn(pr.head.ref, loose);
          let issueUrl;

          // All three live on the PR, so an edit that rewrites the title and body loses them.
          // The attachment is on the Linear side, where a PR edit cannot reach it.
          if (!identifier) {
            const { attachmentsForURL } = await linear(
              `query ($url: String!) {
                 attachmentsForURL(url: $url, first: 10) {
                   nodes { issue { identifier url state { type } } }
                 }
               }`,
              { url: pr.html_url },
            );
            // A cancelled duplicate keeps its attachment, so it must not win over a live one.
            const issues = (attachmentsForURL?.nodes ?? []).map(node => node.issue).filter(Boolean);
            const linked = issues.find(issue => issue.state?.type !== 'canceled') ?? issues[0];
            if (linked) {
              ({ identifier, url: issueUrl } = linked);
            }
          }

          if (!identifier) {
            const { teams } = await linear('query { teams { nodes { id key } } }');
            const team = teams.nodes.find(node => node.key === teamKey);
            if (!team) {
              core.setFailed(`No Linear team with key ${teamKey}.`);
              return;
            }

            const { issueCreate } = await linear(
              `mutation ($input: IssueCreateInput!) {
                 issueCreate(input: $input) { success issue { identifier url } }
               }`,
              {
                input: {
                  teamId: team.id,
                  title: pr.title,
                  description: `Opened by @${pr.user.login}.\n\n${pr.html_url}`,
                },
              },
            );
            if (!issueCreate?.success) {
              core.setFailed('Linear reported the issue was not created.');
              return;
            }
            ({ identifier, url: issueUrl } = issueCreate.issue);

            // The anchor the lookup above reads next time. Best-effort: failing here, after
            // the issue exists, would only re-create it.
            try {
              await linear(
                `mutation ($issueId: String!, $url: String!, $title: String!) {
                   attachmentLinkURL(issueId: $issueId, url: $url, title: $title) { success }
                 }`,
                { issueId: identifier, url: pr.html_url, title: `PR #${PR}` },
              );
            } catch (error) {
              core.warning(`Could not attach the PR to ${identifier}: ${error.message}`);
            }
          }

          // GitHub caps titles at 256, and any existing prefix goes so corrections do not stack.
          const bare = pr.title.replace(new RegExp(`^\\s*\\[${teamKey}-\\d+\\]\\s*`, 'i'), '');
          const prefix = `[${identifier}] `;
          const room = 256 - prefix.length;
          const title = prefix + (bare.length <= room ? bare : `${bare.slice(0, room - 1)}…`);

          if (title === pr.title) {
            core.info(`PR #${PR} is already titled for ${identifier}.`);
            return;
          }

          await github.rest.pulls.update({ ...context.repo, pull_number: Number(PR), title });
          core.info(`PR #${PR} → ${identifier}${issueUrl ? ` (${issueUrl})` : ' (already existed)'}`);
