name: Linear — ticket per merged PR

# Creates a Linear issue for a merged PR that nobody linked one to, so the PR reaches release scope.
# Needs the LINEAR_API_KEY secret (issue-create rights — not the release action's LINEAR_ACCESS_KEY)
# and the LINEAR_TEAM repo variable.

on:
  pull_request:
    types: [ closed ]
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

# The attachment check makes re-runs safe only once the first run has finished writing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  ticket:
    name: Create Linear issue
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
    # The script has no dependencies, so neither a full checkout nor npm ci is needed.
    - uses: actions/checkout@v7
      with:
        sparse-checkout: scripts/linear
        sparse-checkout-cone-mode: false

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Create issue for PR
      run: node scripts/linear/createPrIssue.mjs
      env:
        LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        LINEAR_TEAM: ${{ vars.LINEAR_TEAM }}
        GH_TOKEN: ${{ github.token }}
