name: MSW coverage

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  msw-coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check every API hook has an MSW handler
      run: npm run msw:check-coverage
