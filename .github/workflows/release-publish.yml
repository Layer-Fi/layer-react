name: Release — Publish

# Phase 2b (manual button). Ships the release that Prepare + Tag produced: reads
# the version from package.json on main, checks out its tag (created by the
# Release — Tag hook on PR merge), and publishes it to npm — `alpha` dist-tag for
# a prerelease, `latest` for a stable.
#
# Publishing is all it does, so that nothing slow or flaky can fail a run that has
# already shipped. Tagging belongs to the Release — Tag hook, verifying the
# tarball to the Consumers check on the release PR, and the Linear release, docs,
# Pages and demo-finguard bump to Release — Post-ship, dispatched at the end.
#
# Set `dry_run` to rehearse: npm publish --dry-run, no Post-ship dispatch, and
# the tag is not required (falls back to main HEAD).
#
# npm auth: OIDC trusted publishing (no token). Configure the trusted publisher
# for @layerfi/components on npmjs.com.

on:
  workflow_dispatch:
    inputs:
      next_linear_release:
        description: 'Linear release increment to queue, passed to Post-ship (stable only)'
        type: choice
        options: [ patch, minor, major ]
        default: patch
      dry_run:
        description: 'As dry run'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # OIDC for npm trusted publishing
  actions: write    # dispatch Release — Post-ship

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        ref: main
        fetch-depth: 0

    - name: Resolve release
      id: r
      run: |
        git fetch --tags origin >/dev/null 2>&1 || true
        V=$(node -p "require('./package.json').version")   # relative file require; no node_modules needed
        case "$V" in *-*) TYPE=alpha ;; *) TYPE=stable ;; esac
        {
          echo "version=$V"
          echo "type=$TYPE"
        } >> "$GITHUB_OUTPUT"
        {
          echo "### Publishing"
          echo ""
          echo "| field | value |"
          echo "| --- | --- |"
          echo "| version | \`$V\` |"
          echo "| channel | $TYPE ($([ "$TYPE" = alpha ] && echo 'npm tag: alpha' || echo 'npm tag: latest')) |"
          [ "${{ inputs.dry_run }}" = "true" ] && echo "| mode | DRY RUN |"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "Publishing $V ($TYPE)"

    - name: Check out the tagged commit
      run: |
        V="${{ steps.r.outputs.version }}"
        if git rev-parse "v$V" >/dev/null 2>&1; then
          git checkout "v$V"
        elif [ "${{ inputs.dry_run }}" = "true" ]; then
          echo "::notice::DRY RUN — tag v$V not found; using main HEAD."
        else
          echo "::error::Tag v$V not found. Merge the Release — Prepare PR first (the Release — Tag hook creates it)."
          exit 1
        fi

    # No registry-url: it writes an empty _authToken that makes npm skip OIDC.
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'

    # Trusted publishing needs npm >= 11.5.1; pin it.
    - name: Upgrade npm for trusted publishing
      run: npm install -g npm@11.5.1

    - name: Install dependencies
      run: npm ci

    # Runs against the checked-out tag, so it gates exactly what ships. Prepare checks this too,
    # but strings can land between cutting the release PR and tagging.
    - name: Require translations for a stable release
      if: ${{ steps.r.outputs.type == 'stable' }}
      env:
        V: ${{ steps.r.outputs.version }}
      run: |
        if npm run i18n:check-release; then
          exit 0
        fi

        # Nothing has been published yet, so v$V is not a public artifact — move the tag onto
        # the fixed commit rather than burning the version and leaving a dangling release.
        {
          echo "### Publish blocked — v$V contains untranslated strings"
          echo
          echo "Nothing was published, so \`v$V\` is still free to reuse. To recover:"
          echo
          echo "1. Merge the i18n PRs so the translations are on \`main\`."
          echo "2. Run **Release — Tag** manually with \`retag=true\` — it moves \`v$V\` onto current \`main\`."
          echo "3. Re-run **Release — Publish**."
          echo
          echo "See the previous step for the exact keys."
        } >> "$GITHUB_STEP_SUMMARY"

        echo "::error::Tag v$V contains untranslated strings. Nothing was published. Merge the i18n PRs, run Release — Tag with retag=true, then re-run Release — Publish."
        exit 1

    - name: Publish to npm
      run: npm publish --access public --tag ${{ steps.r.outputs.type == 'alpha' && 'alpha' || 'latest' }} ${{ inputs.dry_run && '--dry-run' || '' }}

    # Warns rather than fails: the package is on npm by now, so a refused dispatch is a
    # button to press, not a red release.
    - name: Dispatch the post-ship refreshes
      if: ${{ !inputs.dry_run }}
      env:
        GH_TOKEN: ${{ github.token }}
        V: ${{ steps.r.outputs.version }}
        NEXT: ${{ inputs.next_linear_release }}
      run: |
        if gh workflow run release-postship.yml --ref main \
             -f "version=$V" -f "next_linear_release=$NEXT"; then
          exit 0
        fi
        echo "::warning::Could not dispatch Release — Post-ship. Nothing after the publish has run."
        {
          echo "### Post-ship was not dispatched"
          echo
          echo "\`v$V\` is on npm, but Linear, the demo-finguard bump and the docs and Pages"
          echo "refresh have not run. Run **Release — Post-ship** with \`version=$V\`."
        } >> "$GITHUB_STEP_SUMMARY"
