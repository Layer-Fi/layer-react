name: Daily npm audit

on:
  schedule:
    - cron: '0 16 * * *'   # daily at 16:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read   # to link findings to the Dependabot PR that fixes them

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      # The production-only tree is what consumers inherit. Peers appear in neither.
      - name: Run npm audit
        run: |
          npm audit --json > audit-all.json || true
          npm audit --omit=dev --json > audit-prod.json || true

      # The artifact is a convenience; a failed upload must not take the report down with it.
      - name: Upload audit JSON
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: |
            audit-all.json
            audit-prod.json

      # Run summary rather than an issue: Dependabot alerts already track per-advisory state.
      - name: Summarize audit
        id: report
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');

            const read = (file) => {
              try { return JSON.parse(fs.readFileSync(file, 'utf8')); } catch { return null; }
            };

            const all = read('audit-all.json');
            const prod = read('audit-prod.json');

            if (!all?.vulnerabilities) {
              core.setOutput('total', 'unknown');
              core.setOutput('runtime', 'unknown');
              core.setFailed('audit-all.json missing or unparseable.');
              return;
            }

            // Ascending, so indexOf doubles as the sort rank. `info` is excluded as noise.
            const SEVERITIES = ['low', 'moderate', 'high', 'critical'];
            const toList = audit => Object.entries(audit?.vulnerabilities ?? {})
              .map(([name, info]) => ({ name, ...info }))
              .filter(v => SEVERITIES.includes(v.severity))
              .sort((a, b) => SEVERITIES.indexOf(b.severity) - SEVERITIES.indexOf(a.severity)
                || a.name.localeCompare(b.name));

            const vulns = toList(all);

            // An empty runtime set would read as "0 consumer-facing" and hide real exposure.
            const prodAvailable = !!prod?.vulnerabilities;
            if (!prodAvailable) {
              core.setFailed('audit-prod.json missing or unparseable — cannot split runtime from dev exposure.');
            }

            const inProd = new Set(toList(prod).map(v => v.name));
            const [runtime, dev] = prodAvailable
              ? [vulns.filter(v => inProd.has(v.name)), vulns.filter(v => !inProd.has(v.name))]
              : [vulns, []];

            core.setOutput('total', String(vulns.length));
            core.setOutput('runtime', prodAvailable ? String(runtime.length) : 'unknown');

            if (vulns.length === 0) {
              await core.summary.addRaw('No vulnerabilities.\n').write();
              return;
            }

            // Both renderers walk this, so neither repeats the prod-available branch.
            const groups = prodAvailable
              ? [
                { title: 'Consumer-facing', slackTitle: 'Consumer Facing', rows: runtime },
                { title: 'Dev / CI only', slackTitle: 'Dev / CI', rows: dev },
              ]
              : [{
                title: '⚠️ Potentially consumer-facing — prod/dev split unknown',
                slackTitle: 'All findings',
                rows: vulns,
              }];

            // npm repeats a title per dependency path; a bare string is the package, not a title.
            const describeVia = (v) => {
              if (!Array.isArray(v.via)) return v.via;
              const titles = v.via.map(x => (typeof x === 'string' ? `via \`${x}\`` : x.title || x.name));
              return [...new Set(titles)].join(', ');
            };

            // `true` = patched version already in range (lockfile refresh); object = manifest change.
            const describeFix = (v) => {
              if (v.fixAvailable === true) return 'yes — `npm audit fix`';
              if (!v.fixAvailable?.version) return 'no';
              const target = `${v.fixAvailable.name}@${v.fixAvailable.version}`;
              return v.fixAvailable.isSemVerMajor ? `${target} (major)` : target;
            };

            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const slug = `${repo.owner}/${repo.repo}`;

            // Single-package PRs name it in the title, grouped PRs in the body; one PR can do both.
            const packagesIn = (pr) => {
              const grouped = [...(pr.body ?? '').matchAll(/^Updates `([^`]+)` from/gm)].map(m => m[1]);
              const single = pr.title.match(/bump (@?[\w./-]+) from/i);
              return [...new Set(single ? [...grouped, single[1]] : grouped)];
            };

            // Security updates bypass grouping, so one package can sit in several open PRs. A
            // failed listing just empties the column.
            const fixPrs = new Map();
            try {
              const openPrs = await github.paginate(github.rest.pulls.list, { ...repo, state: 'open', per_page: 100 });
              for (const pr of openPrs.filter(pr => pr.user?.login === 'dependabot[bot]')) {
                for (const name of packagesIn(pr)) {
                  const entry = { number: pr.number, url: pr.html_url, title: pr.title };
                  fixPrs.set(name, [...(fixPrs.get(name) ?? []), entry]);
                }
              }
            } catch (error) {
              core.warning(`Could not list open PRs, omitting fix links: ${error.message}`);
            }

            const prs = v => (fixPrs.get(v.name) ?? []).map(pr => `[#${pr.number}](${pr.url})`).join(', ');

            const table = (rows) => {
              if (rows.length === 0) return '_None._\n';
              const head = '| package | severity | fix available | open PR | advisories |\n|---|---:|---|---|---|\n';
              const body = rows.slice(0, 50)
                .map(v => `| ${v.name} | ${v.severity} | ${describeFix(v)} | ${prs(v) || '—'} | ${describeVia(v)} |\n`)
                .join('');
              return head + body + (rows.length > 50 ? `\n_+${rows.length - 50} more (see the audit JSON)._\n` : '');
            };

            const alerts = `https://github.com/${slug}/security/dependabot`;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${slug}/actions/runs/${context.runId}`;

            await core.summary.addRaw([
              prodAvailable
                ? `**${runtime.length}** consumer-facing, **${dev.length}** dev/CI-only, most severe first.\n`
                : `> ⚠️ The production-only audit did not produce usable output, so all **${vulns.length}**\n`
                  + '> findings are listed as potentially consumer-facing. The run is marked failed.\n',
              ...groups.map(g => `## ${g.title} — ${g.rows.length}\n\n${table(g.rows)}`),
              '> Peer dependencies (`react`, `react-dom`) are not covered by `npm audit`.\n'
                + `> Per-advisory state lives in [Dependabot alerts](${alerts}).\n`,
              process.env.ARTIFACT_URL ? `Full audit JSON: ${process.env.ARTIFACT_URL}\n` : '',
            ].filter(Boolean).join('\n')).write();

            const {
              SEVERITY_EMOJI, capBlocks, context: contextBlock, group, header, limited, metaLine, prLine,
              row, section, tally,
            } = require('./scripts/ci/slackBlocks.cjs');

            const severityTally = rows => tally([...SEVERITIES].reverse()
              .map(severity => [SEVERITY_EMOJI[severity], rows.filter(v => v.severity === severity).length, severity]))
              || 'none';

            // Counted per group instead, so only findings that need a decision are annotated.
            const slackFix = (v) => {
              if (v.fixAvailable === true) return '';
              if (!v.fixAvailable?.version) return '_no fix_';
              const target = `fix \`${v.fixAvailable.name}@${v.fixAvailable.version}\``;
              return v.fixAvailable.isSemVerMajor ? `${target} *(major)*` : target;
            };

            const slackPrs = v => (fixPrs.get(v.name) ?? []).map(pr => `<${pr.url}|#${pr.number}>`).join(' ');

            const packageLines = rows => limited(
              rows.map(v => row(SEVERITY_EMOJI[v.severity], v.name, slackFix(v), slackPrs(v))), 40,
            );

            const fixableNote = (rows) => {
              const count = rows.filter(v => v.fixAvailable === true).length;
              return count && `${count} of ${rows.length} clear with \`npm audit fix\``;
            };

            // Every finding's PRs: a merge-ready dev PR is still work waiting.
            const prRows = [...new Map(
              vulns.flatMap(v => fixPrs.get(v.name) ?? []).map(pr => [pr.number, pr]),
            ).values()].sort((a, b) => a.number - b.number);

            const blocks = capBlocks([
              header(`npm audit — ${vulns.length} findings`),
              contextBlock(`*${slug}* · <${runUrl}|run summary>`),
              ...(prodAvailable
                ? []
                : [section('⚠️ The production-only audit produced no usable output, so every finding below is listed as *potentially consumer-facing*.')]),
              ...groups.flatMap(g => group({
                title: g.slackTitle ?? g.title,
                count: g.rows.length,
                meta: metaLine(severityTally(g.rows), fixableNote(g.rows)),
                lines: g.rows.length ? packageLines(g.rows) : [],
              })),
              ...(prRows.length ? group({ title: 'Open Fix PRs', lines: prRows.map(prLine) }) : []),
              contextBlock(`<${alerts}|Dependabot alerts> · peer dependencies (\`react\`, \`react-dom\`) are not covered by \`npm audit\``),
            ]);

            // `runtime` is every finding when the prod audit failed, so the split is not stated.
            core.setOutput('slack', `[${slug}] npm audit — ${vulns.length} findings, ${
              prodAvailable ? `${runtime.length} consumer-facing` : 'prod/dev split unknown'}`);
            core.setOutput('slack_blocks', JSON.stringify(blocks));

      # Runs on failure too: a broken audit is when the ping matters most. Counts come from the
      # step above, so the two reports cannot disagree.
      - name: Send Slack notification
        if: ${{ !cancelled() }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TEXT: ${{ steps.report.outputs.slack }}
          SLACK_BLOCKS: ${{ steps.report.outputs.slack_blocks }}
          RUNTIME: ${{ steps.report.outputs.runtime }}
          TOTAL: ${{ steps.report.outputs.total }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "ERROR: SLACK_WEBHOOK secret not configured."
            exit 1
          fi
          # Unset if the summarize step died first; `unknown` must not take the "nothing" branch.
          RUNTIME=${RUNTIME:-unknown}
          TOTAL=${TOTAL:-unknown}
          if [ "$TOTAL" = "0" ]; then
            echo "No vulnerabilities to report to Slack."
            exit 0
          fi
          if [ -z "$SLACK_TEXT" ]; then
            SLACK_TEXT="[$GITHUB_REPOSITORY] npm audit: $RUNTIME consumer-facing, $TOTAL total — <$RUN_URL|run summary>"
          fi
          # Blocks are dropped if the step above never produced them, so a broken summarize
          # still pages someone.
          if [ -n "$SLACK_BLOCKS" ]; then
            PAYLOAD=$(jq -n --arg text "$SLACK_TEXT" --argjson blocks "$SLACK_BLOCKS" '{text: $text, blocks: $blocks}')
          else
            PAYLOAD=$(jq -n --arg text "$SLACK_TEXT" '{text: $text}')
          fi
          # Slack answers a dead webhook with 4xx; plain `curl -s` would swallow that as exit 0.
          curl -sS --fail-with-body -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK"
