name: Release — Post-ship

# Phase 3. Everything that follows the version being on npm: the Linear release, the
# demo-finguard bump, and — on a stable — docs screenshots and Storybook Pages. Release
# — Publish dispatches this on a real ship. Every job is idempotent, so re-dispatching
# is the whole recovery story; that is why none of it lives in the run that publishes.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version that shipped, without the leading v (e.g. 0.1.146)'
        required: true
        type: string
      next_linear_release:
        description: 'Linear release increment to queue (stable only)'
        type: choice
        options: [ patch, minor, major ]
        default: patch

permissions:
  contents: read

concurrency:
  group: release-postship
  cancel-in-progress: false

jobs:
  # Also the proof that the version shipped at all: Publish refuses to publish without
  # the tag, so anything on the registry is safe to build the refreshes from.
  await-npm:
    name: Wait for npm
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Wait for the registry to serve the version
      env:
        V: ${{ inputs.version }}
      run: |
        set -euo pipefail
        for _ in $(seq 1 20); do
          if npm view "@layerfi/components@$V" version >/dev/null 2>&1; then
            exit 0
          fi
          sleep 15
        done
        echo "::error::@layerfi/components@$V is not on npm after 5 minutes. Check that Release — Publish shipped."
        exit 1

  docs:
    name: Docs screenshots
    needs: await-npm
    if: ${{ !contains(inputs.version, '-') }}
    uses: ./.github/workflows/docs-screenshots.yml
    with:
      ref: v${{ inputs.version }}
      dry_run: false
    secrets: inherit

  pages:
    name: Storybook Pages
    needs: await-npm
    if: ${{ !contains(inputs.version, '-') }}
    # A called workflow's token can only narrow the caller job's.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/storybook-pages.yml
    with:
      ref: v${{ inputs.version }}
      public_only: true

  linear:
    name: Linear release
    needs: await-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    # `sync` scans commits, so it needs the history behind the tag.
    - uses: actions/checkout@v7
      with:
        ref: v${{ inputs.version }}
        fetch-depth: 0

    - name: Resolve the Linear versions
      id: v
      env:
        V: ${{ inputs.version }}
        INCREMENT: ${{ inputs.next_linear_release }}
      run: |
        set -euo pipefail
        BASE=${V%%-*}
        # Plain bash bump of X.Y.Z; no semver dependency.
        IFS=. read -r MA MI PA <<< "$BASE"
        case "$INCREMENT" in
          patch) NEXT="$MA.$MI.$((PA + 1))" ;;
          minor) NEXT="$MA.$((MI + 1)).0" ;;
          major) NEXT="$((MA + 1)).0.0" ;;
        esac
        {
          echo "base=$BASE"
          echo "next=$NEXT"
        } >> "$GITHUB_OUTPUT"

    - name: Sync release in Linear
      uses: linear/linear-release-action@v0
      with:
        access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
        command: sync
        version: ${{ steps.v.outputs.base }}
        name: ${{ steps.v.outputs.base }}

    - name: Complete release in Linear
      if: ${{ !contains(inputs.version, '-') }}
      uses: linear/linear-release-action@v0
      with:
        access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
        command: complete
        version: ${{ steps.v.outputs.base }}

    # Seed the next release so it exists in Linear right after this one ships.
    # (CLI can only create it In Progress, not Planned.)
    - name: Queue the next release in Linear
      if: ${{ !contains(inputs.version, '-') }}
      uses: linear/linear-release-action@v0
      with:
        access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
        command: sync
        version: ${{ steps.v.outputs.next }}
        name: ${{ steps.v.outputs.next }}

  finguard:
    name: Bump demo-finguard
    needs: await-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    # GITHUB_TOKEN cannot dispatch cross-repo. Soft-failed: a missing install costs the
    # demo its bump, not the rest of the refresh.
    - name: Mint a token for demo-finguard
      id: token
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.DOCS_BOT_APP_ID }}
        private-key: ${{ secrets.DOCS_BOT_PRIVATE_KEY }}
        owner: Layer-Fi
        repositories: demo-finguard

    # custom, not a dist-tag: tag resolution races anything else being published.
    - name: Dispatch the bump
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        V: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -z "${GH_TOKEN:-}" ]; then
          echo "::warning::DOCS_BOT cannot reach Layer-Fi/demo-finguard. Run Bump — @layerfi/components there with channel=custom, custom_version=$V."
          exit 0
        fi
        gh workflow run bump-layerfi-components.yml \
          --repo Layer-Fi/demo-finguard --ref dev \
          -f channel=custom -f "custom_version=$V"
