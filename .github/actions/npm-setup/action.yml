name: npm setup
description: Node 22 with the npm cache, plus the locked install. Only for workflows that run on the checked-out default branch or a PR head — a local action has to exist in the tree that is checked out.

inputs:
  install:
    description: Run npm ci
    default: 'true'

runs:
  using: composite

  steps:
  - uses: actions/setup-node@v7
    with:
      node-version: '22'
      cache: npm

  - if: ${{ inputs.install == 'true' }}
    shell: bash
    run: npm ci
